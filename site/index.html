<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Terra-Tone — NASA Space Apps Challenge web app pairing Earth environmental data and NASA GIBS satellite frames with real-time audio sonification for accessible climate exploration." />
    <meta name="theme-color" content="#070a13" id="meta-theme-color" />
    <title>Terra-Tone — NASA Earth Sonification & Visual Explorer</title>
    
    <!-- Preconnect to Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    
    <!-- Simple clean SVG icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%230f172a' stroke='%2338bdf8' stroke-width='4'/><circle cx='32' cy='32' r='14' fill='%230284c7'/><path d='M16 32h6M26 24v16M32 18v28M38 24v16M42 32h6' stroke='%23f8fafc' stroke-width='3' stroke-linecap='round'/></svg>" />
    <!-- Journey hand-off: paint the site's own background before CSS loads (no white flash) -->
    <script>(function(){var c='#080b1a';try{var t=localStorage.getItem('terra-tone-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t==='light')c='#f0f6ff'}catch(e){}var s=document.createElement('style');s.textContent='html{background-color:'+c+'}';document.head.appendChild(s)})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/journey/return-to-game.js"></script>
  </body>
</html>
